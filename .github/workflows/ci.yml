name: CI

on:
  pull_request: 
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}   # ensures conda is activated for all steps

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - run: pip install ruff mypy types-psutil types-pyyaml

      # static type checking
      - name: mypy
        run: mypy code

      # lint + complexity + security (replaces pylint, bandit, radon cc)
      - name: ruff check
        run: ruff check

      # formatting check (replaces autopep8)
      - name: ruff format
        run: ruff format --check
      