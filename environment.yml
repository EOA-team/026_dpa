name: 026_dpa_py312
channels:
  - conda-forge
dependencies:
  # runtime
  - python=3.12
  - pywinauto        # Windows GUI automation
  - selenium         # web scraping (browser drivers via bundled selenium-manager)
  - gdal             # osgeo bindings
  - pdal
  - python-pdal
  - python-dotenv
  - pyyaml
  - pyprojroot
